name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (stdlib only — no runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov

      - name: Unit + integration tests
        run: python -m pytest -q --cov=cta --cov-report=term-missing

      - name: Offline end-to-end demo (the acceptance test)
        run: PYTHONPATH=src python -m cta.cli demo

      - name: Import smoke test (every module must import with stdlib only)
        run: |
          PYTHONPATH=src python -c "
          import cta, cta.engine, cta.worker, cta.runtime, cta.cli, cta.bot, cta.ai, cta.state
          import cta.sources, cta.convergence, cta.confidence, cta.classifier, cta.plan
          print('all modules import cleanly — version', cta.__version__)
          "

      - name: Guard against non-stdlib runtime imports
        run: |
          if grep -rnE "^(import|from) (aiohttp|httpx|requests|pydantic|numpy|pandas)" src/ ; then
            echo "::error::Runtime code must stay stdlib-only for Cloudflare Workers"
            exit 1
          fi
          echo "no third-party runtime dependencies"

      - name: Validate wrangler.toml is syntactically sane
        run: |
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path("wrangler.toml").read_text(encoding="utf-8")
          for needle in ('main = "entry.py"', 'name =', '[ai]', '[[durable_objects.bindings]]', 'crons'):
              assert needle in text, f"wrangler.toml missing {needle}"
          print("wrangler.toml looks complete")
          PY
