[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copytrade-aggregator"
version = "2.0.0"
description = "Consensus radar for proven traders across free crypto venues (Hyperliquid, dYdX, GMX) — Cloudflare Python Worker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
py-modules = ["entry"]

# `cta/` sits at the repository root, next to entry.py, because the Cloudflare
# Workers Python runtime only puts the entrypoint's own directory on sys.path.
# It does NOT upload a top-level `python_modules/` held there (verified with
# `wrangler deploy --dry-run`), whereas Workers Builds' automatic `pip install .`
# DOES upload `build/lib/cta/`, which lands off sys.path and fails validation
# with [code: 10021] ModuleNotFoundError. Root placement satisfies both: the
# package ships next to entry.py and `import cta` resolves on Cloudflare.
[tool.setuptools.packages.find]
where = ["."]
include = ["cta*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
