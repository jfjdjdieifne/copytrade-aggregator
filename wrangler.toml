# ─────────────────────────────────────────────────────────────────────────────
# Copy-Trade Aggregator v2 — Cloudflare Python Worker
#
# Deploy:
#   npm i -g wrangler          (or use npx)
#   wrangler login
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put OWNER_TOKEN
#   wrangler deploy
#
# Free plan covers this workload: 100k requests/day, 10k Workers AI neurons/day,
# and a cron trigger every minute is a single request.
# ─────────────────────────────────────────────────────────────────────────────

# Must match the Worker name configured in the Cloudflare dashboard, otherwise
# Workers Builds overrides it and warns that the config name is mismatched.
name = "copytrade-aggregator"
main = "entry.py"
compatibility_date = "2026-09-01"
# Required. Without it wrangler refuses to build at all:
#   "The `python_workers` compatibility flag is required to use Python."
# `disable_python_external_sdk` selects Cloudflare's BUILT-IN Python SDK.
#
# Without it the runtime tries to load an external `workers` package that only
# `pywrangler` vendors into python_modules/. This project deploys with plain
# `wrangler deploy` from Workers Builds, so nothing vendors it and validation
# fails with:
#   ModuleNotFoundError: No module named 'workers'
#   You need to update to workers-py >= 1.9 or to pass disable_python_external_sdk
# The flag is exactly what that message asks for, and we have no third-party
# Python dependencies, so the built-in SDK is all we need.
compatibility_flags = ["python_workers", "disable_python_external_sdk"]
# NOTE: there is deliberately no `[python]` table. Wrangler 4.x does not know the
# key (it warns "Unexpected fields found in top-level field: python") and the
# scheduler is registered through `[triggers].crons` below. The old
# `[python] experimental_cron` flag predates Python Workers going GA.

# ── non-secret configuration ────────────────────────────────────────────────
[vars]
# PLACEHOLDER — replace with your real Worker URL before registering the
# Telegram webhook, otherwise Telegram is told to post to a host that does not
# exist and the bot looks silently dead. `/telegram/setup` prints both the
# expected and the registered URL so a mismatch is visible rather than silent.
WORKER_URL = "https://copytrade-aggregator.<your-subdomain>.workers.dev"

# venues
HL_BASE_URL = "https://api.hyperliquid.xyz"
HL_STATS_URL = "https://stats-data.hyperliquid.xyz/Mainnet/leaderboard"
DYDX_BASE_URL = "https://indexer.dydx.trade/v4"
GMX_BASE_URL = "https://arbitrum.gmxapi.io/v1"
ENABLED_SOURCES = "hyperliquid,dydx,gmx"

# seed wallets for venues with no follower leaderboard (dYdX / GMX)
# comma-separated addresses, e.g. "dydx1abc...,dydx1def..."
DYDX_SEED_WALLETS = ""
GMX_SEED_WALLETS = ""

# discovery + watchlist
WATCHLIST_MAX = "150"
DISCOVERY_MAX_CANDIDATES = "300"
WATCHLIST_MIN_GRADE = "PROVEN"

# convergence gates
MIN_INDEPENDENT_TRADERS = "2"
MIN_ELITE_OR_PROVEN = "2"
CONVERGENCE_WINDOW_MIN = "90"
ENTRY_TOLERANCE_BPS = "50"
MAX_SLIPPAGE_BPS = "50"
MAX_MEDIAN_LEVERAGE = "10"

# emission
MIN_SIGNAL_SCORE = "65"
RISK_PER_TRADE_PCT = "1.0"

# ai
AI_ENABLED = "true"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_DAILY_NEURON_SOFT_CAP = "8000"

# ops
DRY_RUN = "false"
LOG_LEVEL = "INFO"

# ── AI: Workers AI, no key, 10k free neurons/day ────────────────────────────
[ai]
binding = "AI"

# ── state: a Durable Object gives us one serialisation point + SQLite ───────
[[durable_objects.bindings]]
name = "STATE"
class_name = "RadarState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RadarState"]

# ── scheduled work ──────────────────────────────────────────────────────────
# Every minute: scan. The worker itself decides when to re-profile (daily) and
# when to track outcomes, so one cron entry covers all three jobs.
[triggers]
crons = ["* * * * *"]

# ── local development ───────────────────────────────────────────────────────
[dev]
port = 8787

[observability]
enabled = true
head_sampling_rate = 1.0
